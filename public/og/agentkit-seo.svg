<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AgentKit SEO social preview</title>
  <desc id="desc">A framed social preview image for AgentKit SEO, a source-of-truth system for playbooks and agent skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.54" stop-color="#0a1a2c"/>
      <stop offset="1" stop-color="#102b3a"/>
    </linearGradient>
    <linearGradient id="panel" x1="76" y1="64" x2="1124" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071423"/>
      <stop offset="1" stop-color="#0b1b2d"/>
    </linearGradient>
    <radialGradient id="lightA" cx="0" cy="0" r="1" gradientTransform="translate(192 94) rotate(52) scale(470 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f8fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#1f8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightB" cx="0" cy="0" r="1" gradientTransform="translate(1005 486) rotate(90) scale(330 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39d6be" stop-opacity=".22"/>
      <stop offset="1" stop-color="#39d6be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="152" y1="158" x2="300" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2488ff"/>
      <stop offset="1" stop-color="#65e0ff"/>
    </linearGradient>
    <linearGradient id="circuit" x1="270" y1="170" x2="270" y2="363" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#32b4ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#020712" flood-opacity=".36"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#lightA)"/>
  <rect width="1200" height="630" fill="url(#lightB)"/>
  <rect x="76" y="64" width="1048" height="502" rx="30" fill="url(#panel)" stroke="#2b5c7b" stroke-opacity=".34" filter="url(#softShadow)"/>
  <path d="M112 515h976" stroke="#1b6c74" stroke-opacity=".36" stroke-width="2"/>

  <g transform="translate(132 146)">
    <rect width="252" height="252" rx="42" fill="#06111f" stroke="#3fcdf4" stroke-opacity=".18"/>
    <path d="M54 62 118 24h7v43H98v101l27 19v49L54 194.6Z" fill="none" stroke="url(#frame)" stroke-linejoin="round" stroke-width="14"/>
    <path d="M131 44 212 93v72L131 214Z" fill="none" stroke="url(#circuit)" stroke-linejoin="round" stroke-width="10"/>
    <path d="M86 100H117M86 129H117M86 158H117" stroke="#2488ff" stroke-linecap="round" stroke-width="13"/>
    <path d="M138 109 162 85V63M138 128h30l19-19h22M138 147h27l21 21h23M138 167l24 24v22" fill="none" stroke="#65e0ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"/>
    <path d="m158 138 12-12M158 138l12 12M184 126l12 12M184 150l12-12" fill="none" stroke="#65e0ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.6"/>
    <circle cx="162" cy="63" r="8" fill="#06111f" stroke="#65e0ff" stroke-width="6"/>
    <circle cx="210" cy="109" r="8" fill="#06111f" stroke="#65e0ff" stroke-width="6"/>
    <circle cx="210" cy="168" r="8" fill="#06111f" stroke="#65e0ff" stroke-width="6"/>
    <circle cx="162" cy="214" r="8" fill="#06111f" stroke="#65e0ff" stroke-width="6"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" letter-spacing="0">
    <text x="440" y="176" fill="#8fc7ff" font-size="24" font-weight="800">PLAYBOOKS + AGENT SKILLS</text>
    <text x="440" y="260" fill="#f4f9ff" font-size="74" font-weight="900">AgentKit SEO</text>
    <text x="440" y="338" fill="#f4f9ff" font-size="50" font-weight="850">One source of truth.</text>
    <text x="440" y="398" fill="#f4f9ff" font-size="50" font-weight="850">Many optimized surfaces.</text>
    <text x="440" y="462" fill="#b9cce0" font-size="28" font-weight="600">Human-readable methods for LinkedIn, GitHub,</text>
    <text x="440" y="501" fill="#b9cce0" font-size="28" font-weight="600">CV/ATS, portfolio SEO, X, and agent context.</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="760">
    <text x="440" y="550" fill="#9ed3ea">LinkedIn</text>
    <circle cx="542" cy="543" r="4" fill="#2ecbd3"/>
    <text x="562" y="550" fill="#9ed3ea">GitHub</text>
    <circle cx="648" cy="543" r="4" fill="#2ecbd3"/>
    <text x="668" y="550" fill="#9ed3ea">CV/ATS</text>
    <circle cx="768" cy="543" r="4" fill="#2ecbd3"/>
    <text x="790" y="550" fill="#9ed3ea">Portfolio SEO</text>
    <circle cx="952" cy="543" r="4" fill="#2ecbd3"/>
    <text x="974" y="550" fill="#9ed3ea">X/Twitter</text>
